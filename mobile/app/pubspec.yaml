name: stealth_app
description: "Signal (Stealth Chat) - Privacy-first Android Realtime Chat"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0
  drift: ^2.20.0
  stealth_protocol:
    path: ../packages/stealth_protocol
  stealth_crypto:
    path: ../packages/stealth_crypto
  stealth_db:
    path: ../packages/stealth_db
  stealth_sync:
    path: ../packages/stealth_sync
  stealth_ui_kit:
    path: ../packages/stealth_ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
