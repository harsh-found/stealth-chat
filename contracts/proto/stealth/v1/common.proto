syntax = "proto3";

package stealth.v1;

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHENTICATED = 1;
  ERROR_CODE_TOKEN_EXPIRED = 2;
  ERROR_CODE_FORBIDDEN = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_TOO_LARGE = 6;
  ERROR_CODE_INTERNAL = 7;
  ERROR_CODE_UNSUPPORTED_VERSION = 8;
}

message Ping {
  int64 timestamp_ms = 1;
}

message Pong {
  int64 timestamp_ms = 1;
}

message Error {
  string req_id = 1;
  ErrorCode code = 2;
  string message = 3;
  int32 retry_after_ms = 4;
}

message Kick {
  string reason = 1;
}
