syntax = "proto3";

package stealth.v1;

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_TEXT = 1;
  MESSAGE_KIND_IMAGE = 2;
  MESSAGE_KIND_VOICE = 3;
  MESSAGE_KIND_VIDEO = 4;
  MESSAGE_KIND_FILE = 5;
}

message SendMessage {
  string message_id = 1;       // UUIDv7 generated by client
  string conversation_id = 2;  // Target conversation
  MessageKind kind = 3;        // Type of message
  bytes payload = 4;           // Opaque serialized MessageBody or ciphertext
  string reply_to_id = 5;      // Optional reply parent ID
  int64 client_ts_ms = 6;      // Device timestamp
}

message Ack {
  string message_id = 1;
  uint64 seq = 2;              // Monotonic server assigned sequence
  int64 server_ts_ms = 3;
}

message MessageNew {
  string conversation_id = 1;
  uint64 seq = 2;
  string message_id = 3;
  string sender_id = 4;
  MessageKind kind = 5;
  bytes payload = 6;
  string reply_to_id = 7;
  int64 server_ts_ms = 8;
  uint32 edit_version = 9;
}

message ReceiptUpTo {
  string conversation_id = 1;
  uint64 delivered_upto_seq = 2;
  uint64 read_upto_seq = 3;
}

message ReceiptUpdate {
  string conversation_id = 1;
  string user_id = 2;
  uint64 delivered_upto_seq = 3;
  uint64 read_upto_seq = 4;
}

message MessageBody {
  string text = 1;
  string media_id = 2;
  string mime = 3;
  string file_name = 4;
  int64 size_bytes = 5;
  string thumbhash = 6;
  int32 duration_ms = 7;
  repeated int32 waveform = 8;  // Precomputed ~64 amplitude values
}
